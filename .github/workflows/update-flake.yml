# This file is automatically generated from Nix configuration. Do not edit directly.

concurrency:
  cancel-in-progress: false
  group: update-flake
jobs:
  update-flake:
    outputs:
      changed: ${{ steps.check_changes.outputs.changed }}
    permissions:
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Install Lix
        uses: samueldr/lix-gha-installer-action@latest
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            extra-substituters = https://nix-community.cachix.org https://opinionatedcache.cachix.org https://cache.flox.dev https://cache.nixos-cuda.org https://nixos-raspberrypi.cachix.org https://cache.lantian.pub/lantian https://cache.manic.systems
            extra-trusted-public-keys = nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= opinionatedcache.cachix.org-1:zDO4tZBL25vfhVFSHTT+0RNCjn5Z5nEs7sPiDZ6XhuE= flox-cache-public-1:7F4OyH7ZCnFhcze3fJdfyXYLQw/aV7GEed86nQ7IsOs= cache.nixos-cuda.org:74DUi4Ye579gUqzH4ziL9IyiJBlDpMRn9MBN8oNan9M= cache.flakehub.com-3:hJuILl5sVK4iKm86JzgdXW12Y2Hwd5G07qKtHTOcDCM= nixos-raspberrypi.cachix.org-1:4iMO9LXa8BqhU+Rpg6LQKiGa2lsNh/j2oiYLNOQ5sPI= lantian:WVGO7vsRMSEN+h7Lp7kv6SAmrkEXgUGbbXm7jMDjBuQ= cache.manic.systems-1:s6OZanN8Us8vRi0jVivP3qlMn0cYHBjBALKrNe5nH8s=
            max-jobs = auto
            cores = 0
            substitute = true
            builders =
      - name: Enable Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v14
        with:
          use-flakehub: false
      - env:
          CADENCES: '{"0 */12 * * *":["core","system"],"0 4 * * *":["desktop","server"],"0 4 * * 1":["tooling"]}'
          DISPATCH_GROUPS: ${{ inputs.groups }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        id: update
        name: Update tack pins
        run: |
          set -o pipefail

          if [ -n "$DISPATCH_GROUPS" ] && [ "$DISPATCH_GROUPS" != all ]; then
            groups=$DISPATCH_GROUPS
          elif [ -n "$EVENT_SCHEDULE" ]; then
            groups=$(jq -r --arg cron "$EVENT_SCHEDULE" '.[$cron][]' <<<"$CADENCES")
          else
            groups=$(jq -r '[.[][]] | .[]' <<<"$CADENCES")
          fi

          # One commit per group; a failing group doesn't block the rest.
          failed=()
          for group in $groups; do
            echo "::group::Update $group"
            log="/tmp/update-$group.log"
            if ! nix run .#write-lock -- "$group" 2>&1 | tee "$log"; then
              echo "::error::tack update failed for group $group"
              failed+=("$group")
              git checkout -- .tack
            elif ! git diff --quiet -- .tack; then
              UPDATES=$(grep -E -- "->" "$log" || echo "Updated $group pins")
              git add .tack/pins.toml .tack/pins.lock.json
              git commit -m "chore(deps): update $group inputs" -m "$UPDATES"
            fi
            echo "::endgroup::"
          done

          # Reported after the push, so the groups that did update still land.
          echo "failed=${failed[*]}" >>"$GITHUB_OUTPUT"
      - id: check_changes
        name: Check for changes
        run: |
          if git diff --quiet HEAD origin/main; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
      - if: steps.check_changes.outputs.changed == 'true'
        name: Push changes
        run: git push origin main
      - env:
          FAILED: ${{ steps.update.outputs.failed }}
        if: steps.update.outputs.failed != ''
        name: Report failed groups
        run: |
          echo "::error::tack update failed for: $FAILED"
          exit 1
name: Update Flake Inputs
"on":
  schedule:
    - cron: 0 */12 * * *
    - cron: 0 4 * * *
    - cron: 0 4 * * 1
  workflow_dispatch:
    inputs:
      groups:
        default: all
        description: tack group to update
        options:
          - all
          - core
          - system
          - desktop
          - server
          - tooling
        required: false
        type: choice
