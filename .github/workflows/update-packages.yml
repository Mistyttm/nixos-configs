# This file is automatically generated from Nix configuration. Do not edit directly.

concurrency:
  cancel-in-progress: true
  group: update-local-packages
jobs:
  update-free-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Install Lix
        uses: samueldr/lix-gha-installer-action@latest
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            extra-substituters = https://nix-community.cachix.org https://opinionatedcache.cachix.org https://cache.flox.dev https://cache.nixos-cuda.org https://nixos-raspberrypi.cachix.org https://cache.lantian.pub/lantian
            extra-trusted-public-keys = nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= opinionatedcache.cachix.org-1:zDO4tZBL25vfhVFSHTT+0RNCjn5Z5nEs7sPiDZ6XhuE= flox-cache-public-1:7F4OyH7ZCnFhcze3fJdfyXYLQw/aV7GEed86nQ7IsOs= cache.nixos-cuda.org:74DUi4Ye579gUqzH4ziL9IyiJBlDpMRn9MBN8oNan9M= cache.flakehub.com-3:hJuILl5sVK4iKm86JzgdXW12Y2Hwd5G07qKtHTOcDCM= nixos-raspberrypi.cachix.org-1:4iMO9LXa8BqhU+Rpg6LQKiGa2lsNh/j2oiYLNOQ5sPI= lantian:WVGO7vsRMSEN+h7Lp7kv6SAmrkEXgUGbbXm7jMDjBuQ=
            max-jobs = auto
            cores = 0
            substitute = true
            builders =
      - name: Enable Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v14
        with:
          use-flakehub: false
      - name: Setup Cachix
        uses: cachix/cachix-action@v17
        with:
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          name: opinionatedcache
          skipPush: true
      - env:
          PACKAGE: ${{ matrix.package }}
        id: update_package
        name: Update package version
        run: |
          set -euo pipefail

          nix run nixpkgs#nix-update -- \
            "packages.x86_64-linux.${PACKAGE}" \
            --flake \
            --use-update-script

          nix fmt -- "packages/${PACKAGE}"

          if git diff --quiet -- "packages/${PACKAGE}"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - env:
          PACKAGE: ${{ matrix.package }}
        id: commit_message
        if: steps.update_package.outputs.changed == 'true'
        name: Prepare commit message
        run: |
          set -euo pipefail

          package_file="packages/${PACKAGE}"

          old_version=$(git diff -- "$package_file" | sed -nE 's/^-[[:space:]]*version[[:space:]]*=[[:space:]]*"([^"]+)";/\1/p' | head -n1)
          new_version=$(git diff -- "$package_file" | sed -nE 's/^\+[[:space:]]*version[[:space:]]*=[[:space:]]*"([^"]+)";/\1/p' | head -n1)

          if [ -n "${old_version}" ] && [ -n "${new_version}" ]; then
            echo "message=update(packages/${PACKAGE}): ${old_version} -> ${new_version}" >> "$GITHUB_OUTPUT"
          else
            echo "message=update(packages/${PACKAGE}): package update" >> "$GITHUB_OUTPUT"
          fi
      - env:
          PACKAGE: ${{ matrix.package }}
        id: build_package
        if: steps.update_package.outputs.changed == 'true'
        name: Build updated package
        run: |
          set -euo pipefail

          : > build.log
          if nix build ".#packages.x86_64-linux.${PACKAGE}" --no-link --print-build-logs --json > >(tee build.json) 2> >(tee build.log >&2); then
            jq -r '.[].outputs[]' build.json \
              | xargs -I{} nix-store --query --requisites {} \
              | sort -u \
              | cachix push opinionatedcache
            echo "package_failed=false" >> "$GITHUB_OUTPUT"
          else
            log_excerpt=$(tail -n 120 build.log | sed 's/\r$//')
            {
              echo "failure_log_excerpt<<EOF"
              echo "${log_excerpt:-No stderr output captured. Check workflow logs for details.}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            echo "failure_reason=build_failed" >> "$GITHUB_OUTPUT"
            echo "failure_summary=Build failed for this free package. Opening a PR for manual review." >> "$GITHUB_OUTPUT"
            echo "package_failed=true" >> "$GITHUB_OUTPUT"
          fi
      - env:
          COMMIT_MESSAGE: ${{ steps.commit_message.outputs.message }}
          PACKAGE: ${{ matrix.package }}
        if: steps.update_package.outputs.changed == 'true' && steps.build_package.outputs.package_failed != 'true'
        name: Commit and push package update
        run: |
          set -euo pipefail

          git add "packages/${PACKAGE}"

          if git diff --cached --quiet; then
            echo "No staged changes to commit"
            exit 0
          fi

          git commit -m "${COMMIT_MESSAGE}"
          git pull --rebase origin main
          git push origin HEAD:main
      - if: steps.update_package.outputs.changed == 'true' && steps.build_package.outputs.package_failed == 'true'
        name: Upload build log on failure
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: ignore
          name: package-build-log-${{ matrix.package }}
          path: |
            build.log
            build.json
          retention-days: 14
      - if: steps.update_package.outputs.changed == 'true' && steps.build_package.outputs.package_failed == 'true'
        name: Open PR on build failure
        uses: peter-evans/create-pull-request@v7
        with:
          add-paths: packages/${{ matrix.package }}
          body: |
            Automated update for `${{ matrix.package }}` encountered a build failure.

            ${{ steps.build_package.outputs.failure_summary }}

            ```text
            ${{ steps.build_package.outputs.failure_log_excerpt }}
            ```

            Full logs are available as workflow artifact `package-build-log-${{ matrix.package }}`.
          branch: bot/package-update-${{ matrix.package }}-build-failure
          commit-message: ${{ steps.commit_message.outputs.message }}
          delete-branch: false
          title: ${{ steps.commit_message.outputs.message }}
          token: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        package:
          - dispatcharr
          - i-sponsor-block-tv
          - obs-wayland-hotkeys-plus
          - proton-cachyos
          - proton-ge-rtsp
          - wizarr
