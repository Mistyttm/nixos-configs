# This file is automatically generated from Nix configuration. Do not edit directly.

jobs:
  update-topology:
    name: Generate topology diagrams
    permissions:
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Install Lix
        uses: samueldr/lix-gha-installer-action@latest
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            extra-substituters = https://nix-community.cachix.org https://opinionatedcache.cachix.org https://cache.flox.dev https://cache.nixos-cuda.org https://nixos-raspberrypi.cachix.org https://cache.lantian.pub/lantian
            extra-trusted-public-keys = nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= opinionatedcache.cachix.org-1:zDO4tZBL25vfhVFSHTT+0RNCjn5Z5nEs7sPiDZ6XhuE= flox-cache-public-1:7F4OyH7ZCnFhcze3fJdfyXYLQw/aV7GEed86nQ7IsOs= cache.nixos-cuda.org:74DUi4Ye579gUqzH4ziL9IyiJBlDpMRn9MBN8oNan9M= cache.flakehub.com-3:hJuILl5sVK4iKm86JzgdXW12Y2Hwd5G07qKtHTOcDCM= nixos-raspberrypi.cachix.org-1:4iMO9LXa8BqhU+Rpg6LQKiGa2lsNh/j2oiYLNOQ5sPI= lantian:WVGO7vsRMSEN+h7Lp7kv6SAmrkEXgUGbbXm7jMDjBuQ=
            max-jobs = auto
            cores = 0
            substitute = true
            builders =
      - name: Enable Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v14
        with:
          use-flakehub: false
      - name: Build topology diagrams
        run: |
          set -euo pipefail

          nix build .#topology.x86_64-linux.config.output -o topology-result

          shopt -s nullglob
          svgs=(topology-result/*.svg)
          if [ "${#svgs[@]}" -eq 0 ]; then
            echo "::error::nix-topology produced no SVGs"
            exit 1
          fi
          mkdir -p topology
          cp "${svgs[@]}" topology/
      - id: check_changes
        name: Check for changes
        run: |
          # Unlike `git diff`, this also catches new untracked diagrams.
          if [ -z "$(git status --porcelain -- topology)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check_changes.outputs.changed == 'true'
        name: Commit and push changes
        run: |
          set -euo pipefail

          git add topology
          git commit -m "chore: update topology diagrams [skip ci]"
          git push
name: Update Topology Diagrams
"on":
  push:
    branches:
      - main
    paths:
      - modules/**
  workflow_dispatch: {}
