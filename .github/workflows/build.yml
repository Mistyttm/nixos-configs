name: Build and Cache NixOS Systems

on:
  workflow_run:
    workflows:
      - Update Flake Inputs
    types:
      - completed
    branches:
      - main

  pull_request:
    paths:
      - flake.lock

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  evaluate:
    name: Evaluate Flake
    if: >-
      ${{
        github.event_name != 'workflow_run' ||
        github.event.workflow_run.conclusion == 'success'
      }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Maximize disk space
        uses: wimpysworld/nothing-but-nix@main
        with:
          hatchet-protocol: rampage

      - name: Install Lix
        uses: samueldr/lix-gha-installer-action@latest
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Evaluate Hydra jobs
        id: eval
        shell: bash
        run: |
          set -o pipefail

          mkdir -p eval-results

          nix-eval-jobs \
            --flake .#hydraJobs \
            --workers 2 \
            --max-memory-size 2048 \
            > eval-results/results.jsonl || true

          errors=$(jq -s '
            map(select(has("error")))
          ' eval-results/results.jsonl)

          if [ "$(echo "$errors" | jq length)" -gt 0 ]; then
            {
              echo "## ❌ Nix Evaluation Failed"
              echo
              echo "The following Hydra jobs failed evaluation:"
              echo

              echo "$errors" | jq -r '
                .[] |
                "### \(.attr // \"unknown\")\n\n```\n\(.error)\n```\n"
              '
            } >> "$GITHUB_STEP_SUMMARY"

            echo "$errors" | jq -r '
              .[] |
              "::error title=Nix evaluation failed (\(.attr // \"unknown\"))::\(.error | gsub("\n"; " "))"
            '

            exit 1
          fi

          echo "## ✅ Nix Evaluation Passed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "All Hydra jobs evaluated successfully." >> "$GITHUB_STEP_SUMMARY"

  discover:
    name: Discover Systems
    needs: evaluate

    runs-on: ubuntu-latest

    outputs:
      # One entry per system: {system, arch, runner}. Drives the stage 2 matrix.
      include: ${{ steps.matrix.outputs.include }}
      # One entry per architecture that has 2+ systems: {arch, runner, systems}.
      # Drives the stage 1 (shared derivations) matrix.
      shared_groups: ${{ steps.matrix.outputs.shared_groups }}
      has_shared: ${{ steps.matrix.outputs.has_shared }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Lix
        uses: samueldr/lix-gha-installer-action@latest
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - id: matrix
        name: Discover NixOS systems
        shell: bash
        run: |
          set -euo pipefail

          # Ask Nix which platform each system's toplevel is built on, so a new
          # host of a supported architecture needs no workflow change.
          systems=$(nix eval --json .#hydraJobs.nixos --apply '
            attrs:
              builtins.map
                (name: { inherit name; arch = attrs.${name}.system; })
                (builtins.filter
                  (name: builtins.match "^thepetshop.*" name == null)
                  (builtins.attrNames attrs))
          ')

          # Pick a native runner per architecture. An architecture with no
          # runner fails here, loudly, instead of building on the wrong machine.
          include=$(jq -c '
            map({
              system: .name,
              arch: .arch,
              runner: (
                if .arch == "x86_64-linux" then "ubuntu-latest"
                elif .arch == "aarch64-linux" then "ubuntu-24.04-arm"
                else error("no runner configured for \(.arch) (\(.name))")
                end
              )
            })
          ' <<< "$systems")

          # Shared derivations can only be shared between systems of the same
          # architecture, so plan per architecture and skip any architecture
          # with a single system (nothing to share).
          shared_groups=$(jq -c '
            group_by(.arch)
            | map({arch: .[0].arch, runner: .[0].runner, systems: map(.system)})
            | map(select(.systems | length > 1))
          ' <<< "$include")

          {
            echo "include=$include"
            echo "shared_groups=$shared_groups"
            echo "has_shared=$(jq 'length > 0' <<< "$shared_groups")"
          } >> "$GITHUB_OUTPUT"

      - name: Show discovered systems
        run: |
          echo '${{ steps.matrix.outputs.include }}' | jq .

  # Stage 1: build every derivation that more than one system needs, exactly
  # once, and push it to Cachix. Without this, each matrix job starts with an
  # empty store and decides what to build up front, so shared derivations
  # (custom packages, kernels, etc.) get built once per system in parallel.
  # Runs once per architecture that has 2+ systems, each on a native runner.
  build-shared:
    name: Build shared derivations (${{ matrix.group.arch }})

    needs:
      - evaluate
      - discover

    if: ${{ needs.discover.outputs.has_shared == 'true' }}

    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJson(needs.discover.outputs.shared_groups) }}

    runs-on: ${{ matrix.group.runner }}
    timeout-minutes: 360

    env:
      SYSTEMS: ${{ toJSON(matrix.group.systems) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Maximize disk space
        if: ${{ matrix.group.arch == 'x86_64-linux' }}
        uses: wimpysworld/nothing-but-nix@main
        with:
          hatchet-protocol: rampage
          root-safe-haven: '8192'

      # 'carve' is the protocol build-isos.yml already uses on the arm runner.
      - name: Maximize disk space (arm)
        if: ${{ matrix.group.arch != 'x86_64-linux' }}
        uses: wimpysworld/nothing-but-nix@main
        with:
          hatchet-protocol: carve

      - name: Install Lix
        uses: samueldr/lix-gha-installer-action@latest
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            max-jobs = 2

      - name: Enable Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v14
        with:
          use-flakehub: false

      - name: Setup Cachix
        uses: cachix/cachix-action@v17
        with:
          name: opinionatedcache
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Plan shared derivations
        id: plan
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p plan/systems

          # Full derivation closure for one system's toplevel.
          # This is independent of substituter availability and gives us every
          # derivation required to realise the system.
          closure_drvs() {
            local system="$1"
            local toplevel_drv

            toplevel_drv="$(nix eval --raw \
              ".#nixosConfigurations.${system}.config.system.build.toplevel.drvPath")"

            nix-store --query --requisites "$toplevel_drv" \
            | awk '/\.drv$/ { print }' \
            | sort -u
          }

          for system in $(jq -r '.[]' <<< "$SYSTEMS"); do
            closure_drvs "$system" > "plan/systems/$system.txt"
            echo "$system: $(wc -l < "plan/systems/$system.txt") derivations in closure"
          done

          # Needed by 2+ systems == shared derivation work across hosts.
          cat plan/systems/*.txt | sort | uniq -d > plan/shared.txt

          per_system_total=$(cat plan/systems/*.txt | wc -l)
          unique_total=$(cat plan/systems/*.txt | sort -u | wc -l)
          shared=$(wc -l < plan/shared.txt)

          echo "shared=$shared" >> "$GITHUB_OUTPUT"

          {
            echo "## Build plan"
            echo
            echo "| System | Derivations in closure |"
            echo "|---|---|"
            for f in plan/systems/*.txt; do
              echo "| $(basename "$f" .txt) | $(wc -l < "$f") |"
            done
            echo
            echo "- Shared by 2+ systems: **$shared**"
            echo "- Cross-system duplicate derivation references: **$((per_system_total - unique_total))**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build shared derivations
        id: build
        if: steps.plan.outputs.shared != '0'
        # Stay under the 360 minute job limit so the later steps (push, logs)
        # still get to run. Cachix pushes finished paths as they complete, so
        # a re-run resumes where this one stopped.
        timeout-minutes: 320
        shell: bash
        run: |
          # GitHub starts `shell: bash` with -e. Turn it off so a failed build
          # does not abort the script before its exit status is handled.
          set +e
          set -uo pipefail

          mkdir -p build-results
          : > build-results/dryrun.log
          : > build-results/build-shared.log

          # Dry run. The output stays out of the Actions log: it lists every
          # substitutable path (tens of thousands of lines).
          xargs -a plan/shared.txt -n 2000 \
            nix-store --realise --dry-run >> build-results/dryrun.log 2>&1

          awk '
            /will be built:$/ { f = 1; next }
            /^[^ ]/           { f = 0 }
            f && /\.drv$/     { gsub(/^ +/, ""); print }
          ' build-results/dryrun.log | sort -u > build-results/to-build.txt

          to_build=$(wc -l < build-results/to-build.txt)
          echo "Derivations that need building: $to_build"
          echo "- Shared derivations that actually needed building: **$to_build**" >> "$GITHUB_STEP_SUMMARY"

          if [ "$to_build" -eq 0 ]; then
            echo "Nothing to build."
            exit 0
          fi

          echo "::group::Derivations to build"
          cat build-results/to-build.txt
          echo "::endgroup::"

          # Realise ONLY the derivations that need building, in one invocation
          # so nix schedules them properly. Realising the whole shared closure
          # also downloaded the output of every substitutable derivation
          # (~17k paths, over 100 GiB) and filled /nix before the builds were
          # done. Nix fetches just the build inputs it needs for these.
          mapfile -t todo < build-results/to-build.txt

          nix-store --realise \
            --keep-going \
            --max-jobs 2 \
            --no-build-output \
            --option log-lines 80 \
            "${todo[@]}" \
            2>&1 | tee -a build-results/build-shared.log

          exit "${PIPESTATUS[0]}"

      # The cachix daemon already pushes each path as it is built; this is a
      # second, explicit push of what was built here so the cache is complete
      # before stage 2 starts.
      - name: Push built shared derivations to Cachix
        if: ${{ !cancelled() && steps.plan.outputs.shared != '0' }}
        shell: bash
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          set +e
          set -uo pipefail

          if [ ! -s build-results/to-build.txt ]; then
            echo "Nothing was built locally; nothing to push."
            exit 0
          fi

          # Outputs of derivations whose build failed do not exist; skip them.
          # (`[ -e ] && echo` as the last command of the loop would return 1
          # and fail the whole step, so use an if.)
          xargs -a build-results/to-build.txt -n 256 nix-store --query --outputs 2>/dev/null \
            | while IFS= read -r path; do
                if [ -e "$path" ]; then echo "$path"; fi
              done \
            | sort -u > build-results/push-paths.txt

          count=$(wc -l < build-results/push-paths.txt)
          echo "Pushing $count store paths"
          if [ "$count" -gt 0 ]; then
            cachix push opinionatedcache < build-results/push-paths.txt
          fi

      - name: Summarise shared build failure
        if: failure() && steps.build.outcome == 'failure'
        shell: bash
        run: |
          errors="$(grep -aE '^error:|builder for .* failed|cannot build|dependency .* failed' \
            build-results/build-shared.log | sort -u | head -n 50 || true)"

          {
            echo "## ❌ Shared derivation build failed"
            echo
            echo "### Errors"
            echo
            echo '```text'
            echo "${errors:-Unable to parse build errors}"
            echo
            echo "--- last 100 log lines ---"
            tail -n 100 build-results/build-shared.log | tr -d '\000' || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          echo "$errors" | while IFS= read -r error; do
            [ -n "$error" ] && echo "::error title=Shared derivation build failure::$error"
          done

      - name: Upload shared build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nix-build-log-shared-${{ matrix.group.arch }}
          path: |
            build-results/build-shared.log
            build-results/dryrun.log

      - name: Disk usage
        if: always()
        shell: bash
        run: |
          df -h / /nix /mnt || true
          du -sh /tmp build-results 2>/dev/null || true

  # Stage 2: per-system builds, each on a native runner for its architecture.
  # Everything shared is now in Cachix, so each job only builds what is unique
  # to its own system. This stage does not run at all if build-shared failed: a failed shared build means the
  # store is in an unknown state and the per-system jobs would likely just
  # rebuild (and re-fail on) the same derivations anyway, burning 4x the
  # runner time to tell you what stage 1 already told you.
  build:
    name: Build ${{ matrix.system }} (${{ matrix.arch }})

    needs:
      - evaluate
      - discover
      - build-shared

    if: >-
      ${{
        !cancelled() &&
        needs.evaluate.result == 'success' &&
        needs.discover.result == 'success' &&
        (
          needs.build-shared.result == 'success' ||
          needs.build-shared.result == 'skipped'
        )
      }}

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.discover.outputs.include) }}

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Maximize disk space
        if: ${{ matrix.arch == 'x86_64-linux' }}
        uses: wimpysworld/nothing-but-nix@main
        with:
          hatchet-protocol: rampage
          root-safe-haven: '8192'

      # 'carve' is the protocol build-isos.yml already uses on the arm runner.
      - name: Maximize disk space (arm)
        if: ${{ matrix.arch != 'x86_64-linux' }}
        uses: wimpysworld/nothing-but-nix@main
        with:
          hatchet-protocol: carve

      - name: Install Lix
        uses: samueldr/lix-gha-installer-action@latest
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            max-jobs = 2

      - name: Enable Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v14
        with:
          use-flakehub: false

      - name: Setup Cachix
        uses: cachix/cachix-action@v17
        with:
          name: opinionatedcache
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build ${{ matrix.system }}
        id: build
        shell: bash
        run: |
          set -o pipefail

          mkdir -p build-results

          nix build \
            .#nixosConfigurations.${{ matrix.system }}.config.system.build.toplevel \
            --keep-going \
            --log-format internal-json \
            2>&1 | { grep --line-buffered '"action":"msg"' || true; } > build-results/build.jsonl

          exit ${PIPESTATUS[0]}

      - name: Summarise build failure
        if: (failure() || cancelled()) && steps.build.outcome != 'success'
        shell: bash
        run: |
          {
            echo "## ❌ Build failed: ${{ matrix.system }}"
            echo
            echo "### Errors"
            echo
            echo '```text'

            sed -n 's/^@nix //p' build-results/build.jsonl \
            | jq -R -r '
              fromjson? | select(.action == "msg" and .level == 0)
              |
              if (.msg | type) == "string"
              then .msg
              else (.msg.text // tostring)
              end
            ' \
            | sed -E 's/\x1b\[[0-9;]*m//g' \
            || echo "Unable to parse build errors"

            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          sed -n 's/^@nix //p' build-results/build.jsonl \
          | jq -R -r '
            fromjson? | select(.action == "msg" and .level == 0)
            |
            if (.msg | type) == "string"
            then .msg
            else (.msg.text // tostring)
            end
          ' \
          | sed -E 's/\x1b\[[0-9;]*m//g' \
          | while IFS= read -r error; do
              echo "::error title=Nix build failure::$error"
            done

      - name: Upload build logs
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: nix-build-log-${{ matrix.system }}
          path: build-results/build.jsonl

      - name: Disk usage
        if: always()
        shell: bash
        run: |
          df -h / /nix /mnt || true
          du -sh /tmp build-results 2>/dev/null || true
