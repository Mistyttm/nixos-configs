name: Build and Cache NixOS Systems

on:
  workflow_run:
    workflows:
      - Update Flake Inputs
    types:
      - completed
    branches:
      - main

  pull_request:
    paths:
      - flake.lock

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  evaluate:
    name: Evaluate Flake
    if: >-
      ${{
        github.event_name != 'workflow_run' ||
        github.event.workflow_run.conclusion == 'success'
      }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Maximize disk space
        uses: wimpysworld/nothing-but-nix@main
        with:
          hatchet-protocol: rampage

      - name: Install Lix
        uses: samueldr/lix-gha-installer-action@latest
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Evaluate Hydra jobs
        run: |
          nix eval \
            .#hydraJobs \
            --apply builtins.deepSeq \
            >/dev/null

  discover:
    name: Discover Systems
    needs: evaluate

    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Lix
        uses: samueldr/lix-gha-installer-action@latest
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - id: matrix
        name: Discover NixOS systems
        run: |
          echo "matrix=$(nix eval \
            --json \
            .#nixosConfigurations \
            --apply builtins.attrNames)" >> "$GITHUB_OUTPUT"

      - name: Show discovered systems
        run: |
          echo '${{ steps.matrix.outputs.matrix }}'

  build:
    name: Build ${{ matrix.system }}

    needs:
      - evaluate
      - discover

    strategy:
      fail-fast: false
      matrix:
        system: ${{ fromJson(needs.discover.outputs.matrix) }}

    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Maximize disk space
        uses: wimpysworld/nothing-but-nix@main
        with:
          hatchet-protocol: rampage

      - name: Install Lix
        uses: samueldr/lix-gha-installer-action@latest
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            max-jobs = auto

      - name: Enable Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v14
        with:
          use-flakehub: false

      - name: Setup Cachix
        uses: cachix/cachix-action@v17
        with:
          name: opinionatedcache
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build ${{ matrix.system }}
        run: |
          nix build \
            .#hydraJobs.nixos.${{ matrix.system }} \
            --print-build-logs \
            --keep-going \
            -L
