name: Build and Cache NixOS Systems

on:
  workflow_run:
    workflows:
      - Update Flake Inputs
    types:
      - completed
    branches:
      - main

  pull_request:
    paths:
      - flake.lock

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  evaluate:
    name: Evaluate Flake
    if: >-
      ${{
        github.event_name != 'workflow_run' ||
        github.event.workflow_run.conclusion == 'success'
      }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Maximize disk space
        uses: wimpysworld/nothing-but-nix@main
        with:
          hatchet-protocol: rampage

      - name: Install Lix
        uses: samueldr/lix-gha-installer-action@latest
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Evaluate Hydra jobs
        id: eval
        shell: bash
        run: |
          set -o pipefail

          mkdir -p eval-results

          nix-eval-jobs \
            --flake .#hydraJobs \
            --workers 2 \
            --max-memory-size 2048 \
            > eval-results/results.jsonl || true

          errors=$(jq -s '
            map(select(has("error")))
          ' eval-results/results.jsonl)

          if [ "$(echo "$errors" | jq length)" -gt 0 ]; then
            {
              echo "## ❌ Nix Evaluation Failed"
              echo
              echo "The following Hydra jobs failed evaluation:"
              echo

              echo "$errors" | jq -r '
                .[] |
                "### \(.attr // \"unknown\")\n\n```\n\(.error)\n```\n"
              '
            } >> "$GITHUB_STEP_SUMMARY"

            echo "$errors" | jq -r '
              .[] |
              "::error title=Nix evaluation failed (\(.attr // \"unknown\"))::\(.error | gsub("\n"; " "))"
            '

            exit 1
          fi

          echo "## ✅ Nix Evaluation Passed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "All Hydra jobs evaluated successfully." >> "$GITHUB_STEP_SUMMARY"

  discover:
    name: Discover Systems
    needs: evaluate

    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Lix
        uses: samueldr/lix-gha-installer-action@latest
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - id: matrix
        name: Discover NixOS systems
        run: |
          echo "matrix=$(nix eval \
            --json \
            .#hydraJobs.nixos \
            --apply '
              attrs:
                builtins.filter
                  (name: !(builtins.match "^thepetshop.*" name !=null))
                  (builtins.attrNames attrs)
              ')" >> "$GITHUB_OUTPUT"

      - name: Show discovered systems
        run: |
          echo '${{ steps.matrix.outputs.matrix }}'

  # Stage 1: build every derivation that more than one system needs, exactly
  # once, and push it to Cachix. Without this, each matrix job starts with an
  # empty store and decides what to build up front, so shared derivations
  # (custom packages, kernels, etc.) get built once per system in parallel.
  build-shared:
    name: Build shared derivations

    needs:
      - evaluate
      - discover

    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      SYSTEMS: ${{ needs.discover.outputs.matrix }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Maximize disk space
        uses: wimpysworld/nothing-but-nix@main
        with:
          hatchet-protocol: rampage

      - name: Install Lix
        uses: samueldr/lix-gha-installer-action@latest
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            max-jobs = auto

      - name: Enable Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v14
        with:
          use-flakehub: false

      - name: Setup Cachix
        uses: cachix/cachix-action@v17
        with:
          name: opinionatedcache
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Plan shared derivations
        id: plan
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p plan/systems

          # .drv paths Nix would actually build for one system, i.e. the ones
          # no configured substituter (incl. Cachix) can provide.
          missing_drvs() {
            nix build --dry-run \
              ".#nixosConfigurations.$1.config.system.build.toplevel" 2>&1 \
            | awk '
                /will be built:$/ { p = 1; next }
                /^[^ ]/           { p = 0 }
                p && /\.drv$/     { sub(/^ +/, ""); print }
              ' \
            | sort -u
          }

          for system in $(jq -r '.[]' <<< "$SYSTEMS"); do
            missing_drvs "$system" > "plan/systems/$system.txt"
            echo "$system: $(wc -l < "plan/systems/$system.txt") derivations to build"
          done

          # Needed by 2+ systems == would be built 2+ times without this job.
          # This set is closed under dependencies, so realising it never
          # pulls in a system-specific derivation.
          cat plan/systems/*.txt | sort | uniq -d > plan/shared.txt

          per_system_total=$(cat plan/systems/*.txt | wc -l)
          unique_total=$(cat plan/systems/*.txt | sort -u | wc -l)
          shared=$(wc -l < plan/shared.txt)

          echo "shared=$shared" >> "$GITHUB_OUTPUT"

          {
            echo "## Build plan"
            echo
            echo "| System | Derivations to build |"
            echo "|---|---|"
            for f in plan/systems/*.txt; do
              echo "| $(basename "$f" .txt) | $(wc -l < "$f") |"
            done
            echo
            echo "- Shared by 2+ systems (built here, once): **$shared**"
            echo "- Duplicate builds avoided: **$((per_system_total - unique_total))**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build shared derivations
        id: build
        if: steps.plan.outputs.shared != '0'
        shell: bash
        run: |
          set -o pipefail

          mkdir -p build-results

          # The .drv files are already in the store from the dry runs above.
          # `nix build` (not `nix-store --realise`) so we get the same
          # structured internal-json log the per-system build step parses.
          mapfile -t drvs < plan/shared.txt
          nix build \
            "${drvs[@]}" \
            --no-link \
            --keep-going \
            --log-format internal-json \
            2>&1 | tee build-results/build-shared.jsonl

          exit ${PIPESTATUS[0]}

      - name: Summarise shared build failure
        if: failure() && steps.build.outcome == 'failure'
        shell: bash
        run: |
          {
            echo "## ❌ Shared derivation build failed"
            echo
            echo "### Errors"
            echo
            echo '```text'

            sed -n 's/^@nix //p' build-results/build-shared.jsonl \
            | jq -R -r '
              fromjson? | select(.action == "msg" and .level == 0)
              |
              if (.msg | type) == "string"
              then .msg
              else (.msg.text // tostring)
              end
            ' \
            | sed -E 's/\x1b\[[0-9;]*m//g' \
            || echo "Unable to parse build errors"

            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          sed -n 's/^@nix //p' build-results/build-shared.jsonl \
          | jq -R -r '
            fromjson? | select(.action == "msg" and .level == 0)
            |
            if (.msg | type) == "string"
            then .msg
            else (.msg.text // tostring)
            end
          ' \
          | sed -E 's/\x1b\[[0-9;]*m//g' \
          | while IFS= read -r error; do
              echo "::error title=Shared derivation build failure::$error"
            done

      - name: Upload shared build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nix-build-log-shared
          path: build-results/build-shared.jsonl

  # Stage 2: per-system builds. Everything shared is now in Cachix, so each
  # job only builds what is unique to its own system. This stage does not
  # run at all if build-shared failed: a failed shared build means the
  # store is in an unknown state and the per-system jobs would likely just
  # rebuild (and re-fail on) the same derivations anyway, burning 4x the
  # runner time to tell you what stage 1 already told you.
  build:
    name: Build ${{ matrix.system }}

    needs:
      - evaluate
      - discover
      - build-shared

    if: >-
      ${{
        !cancelled() &&
        needs.evaluate.result == 'success' &&
        needs.discover.result == 'success' &&
        needs.build-shared.result == 'success'
      }}

    strategy:
      fail-fast: false
      matrix:
        system: ${{ fromJson(needs.discover.outputs.matrix) }}

    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Maximize disk space
        uses: wimpysworld/nothing-but-nix@main
        with:
          hatchet-protocol: rampage

      - name: Install Lix
        uses: samueldr/lix-gha-installer-action@latest
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            max-jobs = auto

      - name: Enable Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v14
        with:
          use-flakehub: false

      - name: Setup Cachix
        uses: cachix/cachix-action@v17
        with:
          name: opinionatedcache
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build ${{ matrix.system }}
        id: build
        shell: bash
        run: |
          set -o pipefail

          mkdir -p build-results

          nix build \
            .#nixosConfigurations.${{ matrix.system }}.config.system.build.toplevel \
            --keep-going \
            --log-format internal-json \
            2>&1 | tee build-results/build.jsonl

          exit ${PIPESTATUS[0]}

      - name: Summarise build failure
        if: failure() && steps.build.outcome == 'failure'
        shell: bash
        run: |
          {
            echo "## ❌ Build failed: ${{ matrix.system }}"
            echo
            echo "### Errors"
            echo
            echo '```text'

            sed -n 's/^@nix //p' build-results/build.jsonl \
            | jq -R -r '
              fromjson? | select(.action == "msg" and .level == 0)
              |
              if (.msg | type) == "string"
              then .msg
              else (.msg.text // tostring)
              end
            ' \
            | sed -E 's/\x1b\[[0-9;]*m//g' \
            || echo "Unable to parse build errors"

            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          sed -n 's/^@nix //p' build-results/build.jsonl \
          | jq -R -r '
            fromjson? | select(.action == "msg" and .level == 0)
            |
            if (.msg | type) == "string"
            then .msg
            else (.msg.text // tostring)
            end
          ' \
          | sed -E 's/\x1b\[[0-9;]*m//g' \
          | while IFS= read -r error; do
              echo "::error title=Nix build failure::$error"
            done

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nix-build-log-${{ matrix.system }}
          path: build-results/build.jsonl
