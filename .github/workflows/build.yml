name: Build and Cache NixOS Systems
on:
  workflow_run:
    workflows: ["Update Flake Inputs"]
    types: [completed]
    branches: [main]
  pull_request:
    paths:
      - flake.lock
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: Build ${{ matrix.system }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        system: [thekennel, thedogpark, puppylaptop, puppypc]
    if: >-
      ${{
        github.event_name != 'workflow_run' ||
        github.event.workflow_run.conclusion == 'success'
      }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Maximize disk space
        uses: wimpysworld/nothing-but-nix@main
        with:
          hatchet-protocol: rampage

      - name: Install Lix
        uses: samueldr/lix-gha-installer-action@latest
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            max-jobs = auto
            substitute = true

      - name: Enable Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v14
        with:
          use-flakehub: false

      - name: Setup Cachix
        uses: cachix/cachix-action@v15
        with:
          name: opinionatedcache
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true

      - name: Install nix-fast-build
        run: |
          nix profile install github:Mic92/nix-fast-build

      - name: Build Hydra jobs (${{ matrix.system }})
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          nix-fast-build \
            --flake ".#hydraJobs.nixos.${{ matrix.system }}" \
            --skip-cached \
            --cachix-cache opinionatedcache \
            --eval-workers 4 \
            --eval-max-memory-size 2048 \
            -j 4 \
            --stall-timeout 120 \
            --debug