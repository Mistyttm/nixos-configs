# This file is automatically generated from Nix configuration. Do not edit directly.

jobs:
  deploy:
    concurrency:
      cancel-in-progress: false
      group: deploy-foodbowl
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event != 'pull_request' && github.event.workflow_run.conclusion != 'cancelled')
    name: Switch foodbowl to the cached build
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Install Lix
        uses: samueldr/lix-gha-installer-action@latest
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            extra-substituters = https://nix-community.cachix.org https://opinionatedcache.cachix.org https://cache.flox.dev https://cache.nixos-cuda.org https://nixos-raspberrypi.cachix.org https://cache.lantian.pub/lantian
            extra-trusted-public-keys = nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= opinionatedcache.cachix.org-1:zDO4tZBL25vfhVFSHTT+0RNCjn5Z5nEs7sPiDZ6XhuE= flox-cache-public-1:7F4OyH7ZCnFhcze3fJdfyXYLQw/aV7GEed86nQ7IsOs= cache.nixos-cuda.org:74DUi4Ye579gUqzH4ziL9IyiJBlDpMRn9MBN8oNan9M= cache.flakehub.com-3:hJuILl5sVK4iKm86JzgdXW12Y2Hwd5G07qKtHTOcDCM= nixos-raspberrypi.cachix.org-1:4iMO9LXa8BqhU+Rpg6LQKiGa2lsNh/j2oiYLNOQ5sPI= lantian:WVGO7vsRMSEN+h7Lp7kv6SAmrkEXgUGbbXm7jMDjBuQ=
      - env:
          DEPLOY_KEY: ${{ secrets.FOODBOWL_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.FOODBOWL_KNOWN_HOSTS }}
        name: Configure SSH
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

          # foodbowl is only reachable over WireGuard, via thedogpark.
          cat > ~/.ssh/config <<'CONF'
          Host thedogpark
            HostName mistyttm.dev
            User deploy
          Host foodbowl
            HostName 10.100.0.6
            User root
            ProxyJump thedogpark
          Host *
            IdentityFile ~/.ssh/deploy
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ServerAliveInterval 15
          CONF
        shell: bash
      - name: Switch foodbowl
        run: |
          # Builds on the (aarch64) runner, never on the Pi; anything CI cached is just fetched.
          # --no-reexec: skip re-running with the target's own nixos-rebuild.
          nix run --inputs-from . nixpkgs#nixos-rebuild-ng -- switch \
            --flake .#foodbowl \
            --target-host foodbowl \
            --use-substitutes \
            --no-reexec
        shell: bash
      - name: Clean old generations
        run: |
          # Runs `nh clean all` with the host's programs.nh.clean.extraArgs.
          ssh foodbowl systemctl start nh-clean.service
        shell: bash
    timeout-minutes: 60
name: Deploy foodbowl
"on":
  workflow_dispatch: {}
  workflow_run:
    branches:
      - main
    types:
      - completed
    workflows:
      - Build and Cache NixOS Systems
permissions:
  contents: read
