# tack pins. generated by flake-file write-tack.
# nix reads pins.lock.json; this file drives tack update

[tack]
recomposable = true

[all_follow]
flake-parts = "flake-parts"
home-manager = "home-manager"
nixpkgs = "nixpkgs"
nixpkgs-lib = "nixpkgs"

[inputs.devshell]
url = "github:numtide/devshell"

[inputs.direnv-instant]
url = "github:Mic92/direnv-instant"

[inputs.flake-file]
url = "github:Mistyttm/flake-file/tack-additions"

[inputs.flake-parts]
url = "github:hercules-ci/flake-parts"

[inputs.git-hooks-nix]
url = "github:cachix/git-hooks.nix"

[inputs.github-actions-nix]
url = "github:synapdeck/github-actions-nix"

[inputs.grimoire]
url = "github:Slush97/grimoire"

[inputs.home-manager]
url = "github:nix-community/home-manager"

[inputs.import-tree]
url = "github:denful/import-tree"

[inputs.jovian-nixos]
url = "github:Jovian-Experiments/Jovian-NixOS"

[inputs.laminix]
url = "github:jackboykin/laminix"

[inputs.mkdocs-flake]
url = "github:applicative-systems/mkdocs-flake"

[inputs.nix-cachyos-kernel]
url = "github:xddxdd/nix-cachyos-kernel/release"
exclude_follow = ["nixpkgs"]

[inputs.nix-index-database]
url = "github:nix-community/nix-index-database"

[inputs.nix-minecraft]
url = "github:Infinidoge/nix-minecraft"

[inputs.nix-topology]
url = "github:oddlama/nix-topology"

[inputs.nix-vscode-extensions]
url = "github:nix-community/nix-vscode-extensions"

[inputs.nix-wrapper-modules]
url = "github:nix-community/nix-wrapper-modules"

[inputs.nixos-hardware]
url = "github:NixOS/nixos-hardware"

[inputs.nixpkgs]
url = "https://channels.nixos.org/nixos-unstable/nixexprs.tar.zst"

[inputs.plasma-manager]
url = "github:nix-community/plasma-manager"

[inputs.skwd-wall]
url = "github:liixini/skwd-wall/nix"

[inputs.sops-nix]
url = "github:Mic92/sops-nix"

[inputs.tack]
url = "github:manic-systems/tack"

[inputs.vpn-confinement]
url = "github:Maroka-chan/VPN-Confinement"
